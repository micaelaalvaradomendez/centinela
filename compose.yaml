name: centinela

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centinela_db}
      POSTGRES_USER: ${POSTGRES_USER:-centinela_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-centinela_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxmox-sim:
    build:
      context: .
      dockerfile: test/back/proxmox-sim.Dockerfile
    environment:
      PROXMOX_NODE: proxmox
      PROXMOX_TOKEN_ID: centinela-api@pve!backend-token
      PROXMOX_TOKEN_SECRET: demo-proxmox-secret
      PROXMOX_SIM_PORT: "8081"
      PROXMOX_SIM_DURACION_TAREA: "2"
    ports:
      - "${PROXMOX_SIM_PORT:-8081}:8081"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: development
      DB_DSN: host=db user=${POSTGRES_USER:-centinela_admin} password=${POSTGRES_PASSWORD:-centinela_password} dbname=${POSTGRES_DB:-centinela_db} port=5432 sslmode=disable TimeZone=UTC
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-me-32}
      # 32+ caracteres: crypto.NuevoOfuscadorVMID aborta el arranque si falta.
      INSTANCE_ID_SALT: ${INSTANCE_ID_SALT:-centinela-local-instance-id-salt-0123456789}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-centinela_redis}
      # Exactamente 32 caracteres ASCII (= 256 bits) para AES-256-GCM
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      EMAIL_PROVIDER: mock
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}
      PROXMOX_URL: http://proxmox-sim:8081/api2/json
      PROXMOX_NODE: proxmox
      PROXMOX_TOKEN_ID: centinela-api@pve!backend-token
      PROXMOX_TOKEN_SECRET: demo-proxmox-secret
      PROXMOX_PROTECTED_VMIDS: "100,101"
      INITIAL_ADMIN_EMAIL: admin@elcentinela.com
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Prueba123$}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxmox-sim:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-centinela_password}
    volumes:
      - ./scripts/demo-seed.sql:/seed.sql:ro
    command:
      - psql
      - -h
      - db
      - -U
      - ${POSTGRES_USER:-centinela_admin}
      - -d
      - ${POSTGRES_DB:-centinela_db}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed.sql
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-centinela_redis}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-centinela_redis} ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
