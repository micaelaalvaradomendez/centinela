name: centinela

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centinela_db}
      POSTGRES_USER: ${POSTGRES_USER:-centinela_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-centinela_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      AUTH_MODE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-centinela_admin}:${POSTGRES_PASSWORD:-centinela_password}@db:5432/${POSTGRES_DB:-centinela_db}?sslmode=disable
      HTTP_ADDR: :8080
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-me-32}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: