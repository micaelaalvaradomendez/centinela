# Nginx del borde (INF-05 / FIX-31): solo HTTPS hacia el frontend y la API.
#
# Esta configuración se versiona en el repositorio integrador porque la del servidor
# (CT 103) no está en los submódulos. La usan:
#   - test/back/compose.yaml (servicio edge), para verificar TLS y la redirección
#     contra el backend real con un certificado de prueba;
#   - infraestructura, como referencia de la configuración desplegada.
# Los certificados NO se versionan acá: en el servidor se montan en /etc/nginx/tls/.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP no sirve contenido: todo se redirige a HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/edge.crt;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE de /api/events (BAC-21C): sin buffer ni corte por inactividad corta.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
