# Stub mínimo de la API de Proxmox VE para las pruebas de aceptación.
# Responde lo que consume backend/internal/adapters/secondary/proxmox/client.go:
#   GET  /api2/json/cluster/resources                          -> inventario fijo (VMs, LXC y entradas que deben descartarse)
#   POST /api2/json/nodes/{node}/{tipo}/{vmid}/status/{accion} -> UPID
#   DELETE /api2/json/nodes/{node}/{tipo}/{vmid}               -> UPID
#   GET  /api2/json/nodes/{node}/status                        -> estado del nodo (CPU, RAM, disco, uptime)
#   GET  /api2/json/nodes/{node}/tasks/{upid}/status           -> tarea terminada con exitstatus OK
# Autenticación: exige "Authorization: PVEAPIToken=..." igual que Proxmox; sin token responde 401.
# Cualquier otra ruta responde 500 para que el backend la traduzca a un error controlado.
server {
    listen 80;
    default_type application/json;

    # Caída simulada (BAC-22, FIX-40): mientras exista /tmp/proxmox-caido, todo responde 503 y el backend
    # lo traduce a 502 PROXMOX_UNAVAILABLE. Se usa en lugar de detener el contenedor: con el contenedor
    # detenido, el nombre "proxmox" deja de resolver en Docker y la búsqueda DNS del host (Tailscale)
    # puede llevar al Proxmox real.
    if (-f /tmp/proxmox-caido) {
        return 503 '{"errors":"stub de Proxmox caído (simulado)"}';
    }

    set $autorizado 0;
    if ($http_authorization ~ "^PVEAPIToken=stub@pve!tests=stub-secret$") {
        set $autorizado 1;
    }

    location = /api2/json/cluster/resources {
        if ($autorizado = 0) { return 401 '{"errors":"authentication failure"}'; }
        return 200 '{"data":[
            {"id":"qemu/101","vmid":101,"type":"qemu","name":"web-01","node":"pve","status":"running","cpu":0.25,"mem":1073741824,"maxmem":4294967296},
            {"id":"lxc/102","vmid":102,"type":"lxc","name":"db-01","node":"pve","status":"stopped","cpu":0,"mem":0,"maxmem":2147483648},
            {"id":"qemu/103","vmid":103,"type":"qemu","name":"ci-runner","node":"pve","status":"running","cpu":0.5,"mem":2147483648,"maxmem":8589934592},
            {"id":"node/pve","type":"node","node":"pve","status":"online"},
            {"id":"storage/pve/local","type":"storage","node":"pve","status":"available"}
        ]}';
    }

    location ~ ^/api2/json/nodes/([^/]+)/(qemu|lxc)/([0-9]+)/status/(start|stop|shutdown|reboot)$ {
        if ($autorizado = 0) { return 401 '{"errors":"authentication failure"}'; }
        # Como en Proxmox, cada tarea tiene un UPID distinto (tareas_asincronas exige UPID único).
        return 200 '{"data":"UPID:$1:$request_id:$4:$3:stub@pve!tests:"}';
    }

    location ~ ^/api2/json/nodes/([^/]+)/(qemu|lxc)/([0-9]+)$ {
        if ($autorizado = 0) { return 401 '{"errors":"authentication failure"}'; }
        return 200 '{"data":"UPID:$1:$request_id:destroy:$3:stub@pve!tests:"}';
    }

    # BAC-22: estado del nodo con el formato de Proxmox 9 (el mismo del simulador del backend).
    # Valores elegidos para verificar la normalización: CPU 25 % con 8 núcleos, RAM 8 de 16 GiB (50 %),
    # disco 25 de 100 GiB (25 %) y 3 días + 2 h de uptime (266400 s).
    location ~ ^/api2/json/nodes/([^/]+)/status$ {
        if ($autorizado = 0) { return 401 '{"errors":"authentication failure"}'; }
        return 200 '{"data":{
            "cpu":0.25,
            "cpuinfo":{"model":"stub","sockets":1,"cores":8,"cpus":8,"mhz":"3000.000"},
            "memory":{"total":17179869184,"used":8589934592,"free":8589934592,"available":8589934592},
            "swap":{"total":0,"used":0,"free":0},
            "rootfs":{"total":107374182400,"used":26843545600,"free":80530636800,"avail":80530636800},
            "uptime":266400,
            "loadavg":["0.10","0.10","0.10"],
            "pveversion":"pve-manager/9.2.2/stub"
        }}';
    }

    # INF-07B / BAC-25A: toda tarea del stub ya terminó bien, así el seguimiento de UPID
    # publica TASK_FINISHED en la primera consulta (formato de Proxmox: status "stopped").
    location ~ ^/api2/json/nodes/([^/]+)/tasks/.+/status$ {
        if ($autorizado = 0) { return 401 '{"errors":"authentication failure"}'; }
        # BAC-25C: mientras exista /tmp/tareas-en-curso, toda tarea figura en ejecución (status "running"),
        # para probar que el backend las retoma al reiniciarse.
        if (-f /tmp/tareas-en-curso) { return 200 '{"data":{"status":"running","node":"$1","type":"stub"}}'; }
        return 200 '{"data":{"status":"stopped","exitstatus":"OK","node":"$1","type":"stub"}}';
    }

    location / {
        return 500 '{"errors":"ruta no soportada por el stub"}';
    }
}
