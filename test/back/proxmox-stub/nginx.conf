# Stub mínimo de la API de Proxmox VE para las pruebas de aceptación.
# Responde solo lo que consume backend/internal/adapters/secondary/proxmox/client.go:
#   POST /api2/json/access/ticket          -> ticket + CSRF
#   GET  /api2/json/cluster/resources      -> inventario fijo (VMs, LXC y entradas que deben descartarse)
#   POST /api2/json/nodes/{node}/{tipo}/{vmid}/status/{accion} -> UPID
# Cualquier otra ruta responde 500 para que el backend la traduzca a un error controlado.
server {
    listen 80;
    default_type application/json;

    location = /api2/json/access/ticket {
        return 200 '{"data":{"ticket":"PVE:stub@pve:TICKET","CSRFPreventionToken":"stub-csrf"}}';
    }

    location = /api2/json/cluster/resources {
        return 200 '{"data":[
            {"id":"qemu/101","vmid":101,"type":"qemu","name":"web-01","node":"pve","status":"running"},
            {"id":"lxc/102","vmid":102,"type":"lxc","name":"db-01","node":"pve","status":"stopped"},
            {"id":"qemu/103","vmid":103,"type":"qemu","name":"ci-runner","node":"pve","status":"running"},
            {"id":"node/pve","type":"node","node":"pve","status":"online"},
            {"id":"storage/pve/local","type":"storage","node":"pve","status":"available"}
        ]}';
    }

    location ~ ^/api2/json/nodes/([^/]+)/(qemu|lxc)/([0-9]+)/status/(start|stop)$ {
        return 200 '{"data":"UPID:$1:stub:$4:$3"}';
    }

    location / {
        return 500 '{"errors":"ruta no soportada por el stub"}';
    }
}
