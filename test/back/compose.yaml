services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centinela_test
      POSTGRES_USER: centinela_test
      POSTGRES_PASSWORD: centinela_test
    ports:
      - "127.0.0.1:${BACKEND_TEST_DB_PORT:-15433}:5432"
    volumes:
      - backend_test_postgres:/var/lib/postgresql/data
      - ${CENTINELA_ROOT:-../..}/backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela_test -d centinela_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      # CENTINELA_ROOT permite construir otra revisión (p. ej. origin/main exportado con
      # git archive, con backend/ y docker/) sin modificar el submódulo.
      context: ${CENTINELA_ROOT:-../..}
      dockerfile: docker/backend.Dockerfile
    environment:
      DB_DSN: host=db user=centinela_test password=centinela_test dbname=centinela_test port=5432 sslmode=disable TimeZone=UTC
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters
      JWT_ACCESS_TTL_HOURS: "1"
      JWT_REFRESH_TTL_DAYS: "1"
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      APP_NAME: Centinela Test
      # Proxmox VE simulado (proxmox-stub/nginx.conf) para verificar BAC-14, FIX-16 y SEC-04
      # con respuestas 200 reales, sin depender de un hipervisor físico.
      PROXMOX_BASE_URL: http://proxmox:80
      PROXMOX_NODE: pve
      # Desde 725d436 el cliente usa solo API Token; el stub valida este token exacto.
      PROXMOX_TOKEN_ID: stub@pve!tests
      PROXMOX_TOKEN_SECRET: stub-secret
      # VMIDs de infraestructura protegidos contra acciones destructivas (725d436).
      # Se protege la 103 del stub para verificarlo sin afectar al resto de los casos.
      PROXMOX_PROTECTED_VMIDS: "103"
      # BAC-21C: Redis para los tickets de /api/events y el bus Pub/Sub.
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis-test
      # INF-05: lista blanca de orígenes CORS (middleware/cors_middleware.go)
      ALLOWED_ORIGINS: http://front.centinela.test
      # BAC-16B: este backend usa el correo simulado por consola (lo leen las pruebas).
      EMAIL_PROVIDER: mock
    image: centinela-back-tests-backend:local
    ports:
      - "127.0.0.1:${BACKEND_TEST_API_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      proxmox:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # BAC-16B: segundo backend (misma imagen y base) con EMAIL_PROVIDER=smtp contra Mailpit.
  backend-smtp:
    image: centinela-back-tests-backend:local
    pull_policy: never
    environment:
      DB_DSN: host=db user=centinela_test password=centinela_test dbname=centinela_test port=5432 sslmode=disable TimeZone=UTC
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters
      JWT_ACCESS_TTL_HOURS: "1"
      JWT_REFRESH_TTL_DAYS: "1"
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      APP_NAME: Centinela Test
      PROXMOX_BASE_URL: http://proxmox:80
      PROXMOX_NODE: pve
      # Desde 725d436 el cliente usa solo API Token; el stub valida este token exacto.
      PROXMOX_TOKEN_ID: stub@pve!tests
      PROXMOX_TOKEN_SECRET: stub-secret
      # VMIDs de infraestructura protegidos contra acciones destructivas (725d436).
      # Se protege la 103 del stub para verificarlo sin afectar al resto de los casos.
      PROXMOX_PROTECTED_VMIDS: "103"
      # BAC-21C: Redis para los tickets de /api/events y el bus Pub/Sub.
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: redis-test
      ALLOWED_ORIGINS: http://front.centinela.test
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: centinela
      SMTP_PASS: centinela
      SMTP_FROM: noreply@centinela.test
      # BAC-16B exige STARTTLS: el backend confía en la CA de prueba que firmó el certificado de Mailpit.
      SSL_CERT_FILE: /etc/centinela-test/ca.crt
    volumes:
      - ./mailpit-tls/ca.crt:/etc/centinela-test/ca.crt:ro
    ports:
      - "127.0.0.1:${BACKEND_TEST_SMTP_API_PORT:-18081}:8080"
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 3s
      retries: 30

  # INF-05 / FIX-31: Nginx del borde con TLS (docker/nginx-edge.conf, versionado en el repo
  # integrador) delante del backend real. Certificado de prueba firmado por edge-tls/ca.crt.
  edge:
    image: nginx:1.29-alpine
    volumes:
      - ../../docker/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge-tls/edge.crt:/etc/nginx/tls/edge.crt:ro
      - ./edge-tls/edge.key:/etc/nginx/tls/edge.key:ro
    ports:
      - "127.0.0.1:${BACKEND_TEST_EDGE_HTTP_PORT:-18089}:80"
      - "127.0.0.1:${BACKEND_TEST_EDGE_HTTPS_PORT:-18453}:443"
    depends_on:
      backend:
        condition: service_healthy

  # Servidor SMTP de prueba con API HTTP para leer los correos recibidos.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      # STARTTLS obligatorio, como el relay real (587): si el backend enviara las credenciales sin cifrar, Mailpit lo rechaza.
      MP_SMTP_TLS_CERT: /etc/mailpit-tls/mailpit.crt
      MP_SMTP_TLS_KEY: /etc/mailpit-tls/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "1"
    volumes:
      - ./mailpit-tls:/etc/mailpit-tls:ro
    ports:
      - "127.0.0.1:${BACKEND_TEST_MAILPIT_PORT:-18025}:8025"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redis-test"]

  proxmox:
    image: nginx:1.27-alpine
    volumes:
      - ./proxmox-stub/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_test_postgres:
